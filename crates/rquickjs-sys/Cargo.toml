[package]
name = "rquickjs-sys"
version = "0.14.0"
edition = "2021"
rust-version = "1.85"
authors = ["Mees Delzenne <mees.delzenne@gmail.com>"]
description = "QuickJS bindings for rquickjs, with debugger hooks (fork)"
license = "MIT"
repository = "https://github.com/DelSkayn/rquickjs.git"
readme = "README.md"
keywords = ["quickjs", "ecmascript", "javascript", "es6", "es2020"]
categories = ["external-ffi-bindings"]
publish = false

[features]
bindgen = ["bindgen-rs"]
update-bindings = ["bindgen"]
logging = ["pretty_env_logger"]
disable-assertions = []
dump-atoms = []
dump-bytecode = []
dump-free = []
dump-gc = []
dump-gc-free = []
dump-leaks = []
dump-mem = []
dump-module-resolve = []
dump-objects = []
dump-promise = []
dump-read-object = []
dump-shapes = []

[build-dependencies]
cc = "1"
bindgen-rs = { package = "bindgen", version = "0.72", optional = true }
pretty_env_logger = { version = "0.5", optional = true }
